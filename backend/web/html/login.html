<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-page">
    <header class="site-header">
        <a class="site-header__brand" href="/">4U</a>
    </header>

    <main class="login-card">
        <h1>Вход</h1>
        <p>Введите логин и пароль</p>

        <form class="login-form" id="loginForm" novalidate>
            <div id="loginError" class="login-error-banner"></div>

            <label for="loginInput">Логин</label>
            <input id="loginInput" type="text" placeholder="Введите логин">

            <label for="passwordInput">Пароль</label>
            <input id="passwordInput" type="password" placeholder="Введите пароль">

            <button type="submit">Войти</button>
        </form>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('loginForm');
            const loginInput = document.getElementById('loginInput');
            const passwordInput = document.getElementById('passwordInput');
            const loginError = document.getElementById('loginError');

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                loginError.style.display = 'none';
                loginError.textContent = '';

                const login = loginInput.value.trim();
                const password = passwordInput.value.trim();

                if (!login || !password) {
                    loginError.textContent = 'Пожалуйста, заполните логин и пароль';
                    loginError.style.display = 'block';
                    return;
                }

                try {
                    const response = await fetch('/api/v1/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ login, password })
                    });
                    const json = await response.json();
                    if (!response.ok) {
                        throw new Error(json.message || 'Неверный логин или пароль');
                    }

                    localStorage.setItem('token', json.data.token);
                    window.location.href = '/admin';
                    return;
                } catch (err) {
                    loginError.textContent = err.message;
                    loginError.style.display = 'block';
                    return;
                }




            });
        });
    </script>
</body>
</html>
